name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python -m pytest tests/test_agents_quick.py tests/test_commander.py tests/test_dag_workflow.py tests/test_security_rbac.py -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aios:${{ github.sha }} .
