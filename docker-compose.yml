# AI Company OS v1.0 — Production Docker Compose (dual-container)
services:
  app:
    build: .
    container_name: aios-app
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./backend/database:/app/backend/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: aios-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
